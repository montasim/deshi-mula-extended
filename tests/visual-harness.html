<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Compiled extension visual harness</title>
    <link rel="stylesheet" href="../dist/extension/styles.css" />
    <style>
      body { margin: 0; color: #183149; background: #eef2f4; font-family: system-ui, sans-serif; }
      header { display: flex; justify-content: space-between; padding: 18px 34px; background: white; border-bottom: 1px solid #d5dfe6; }
      main { width: min(720px, calc(100% - 48px)); margin: 52px auto; }
      article { padding: 22px; border: 1px solid #d4dee6; border-radius: 10px; background: white; }
      h1 { font: 700 30px Georgia, serif; }
      h2 { display: inline; font: 700 18px Georgia, serif; }
      p { color: #6e8192; line-height: 1.6; }
    </style>
  </head>
  <body>
    <header><strong>Deshi Mula</strong><span>Compiled extension harness</span></header>
    <main>
      <h1>Workplace stories</h1>
      <article>
        <a href="https://deshimula.com/companies/technonext-ltd"><h2>TechnoNe&gt;&lt;t Ltd</h2></a>
        <p>Company identity and Research trigger are discovered from the canonical company link.</p>
      </article>
    </main>
    <script>
      const company = {
        snapshotVersion: '1.1.0-20260724',
        snapshotDate: '2026-07-24',
        slug: 'technonext-ltd',
        name: 'TechnoNext Ltd',
        sourceName: 'TechnoNe><t Ltd',
        brief: {
          headline: '81 stories. Recent reports lean negative.',
          copy: 'Job security is the most frequently matched theme in this snapshot. Read individual stories before drawing conclusions.',
          disclaimer: 'Stories are unverified personal accounts. Counts describe the published snapshot, not an independent verdict.'
        },
        metrics: {
          stories: 81,
          rating: 3.2,
          recommendPercent: 44,
          sentiment: { positive: 7, mixed: 6, negative: 68 }
        },
        themes: [
          { label: 'Job security', detail: 'Layoffs, termination, and stability', count: 18 },
          { label: 'Management', detail: 'Leadership and communication', count: 14 },
          { label: 'Learning & growth', detail: 'Learning, mentorship, and progression', count: 9 }
        ],
        links: [
          { label: 'Deshi Mula profile', url: '#', kind: 'deshimula', verification: 'native' },
          { label: 'Official website', url: 'https://technonext.com', kind: 'website', verification: 'verified' },
          { label: 'LinkedIn', url: 'https://linkedin.com', kind: 'linkedin', verification: 'verified' },
          { label: 'Career page', url: 'https://technonext.com/career', kind: 'careers', verification: 'verified' }
        ],
        verificationStatus: 'verified',
        confidence: 1
      };
      const stories = {
        snapshotVersion: company.snapshotVersion,
        total: 2,
        items: [
          { id: '1', title: 'অহেতুক বরখাস্ত করা প্রসঙ্গে', excerpt: '', role: 'AI Engineer', date: 'July 15, 2026', vibe: 'negative', reactions: 6, comments: 0, url: '#' },
          { id: '2', title: 'Engineering culture', excerpt: '', role: 'Anonymous', date: 'June 26, 2026', vibe: 'positive', reactions: 1, comments: 2, url: '#' }
        ]
      };
      const jobs = {
        snapshotVersion: company.snapshotVersion,
        checkedAt: '2026-07-24',
        jobs: [],
        salary: { status: 'partial', label: 'Negotiable', summary: 'Recent official hiring posts say compensation is negotiable.', source: 'Official LinkedIn', observedAt: '2026-07-24' },
        careerUrl: 'https://technonext.com/career'
      };
      window.chrome = {
        runtime: {
          sendMessage: async (message) => {
            if (message.type === 'consent:get') return false;
            if (message.type === 'consent:set') return message.consented;
            const path = message.request.path;
            if (path.startsWith('/companies')) return { ok: true, status: 200, data: { items: [company] } };
            if (path.startsWith('/company')) return { ok: true, status: 200, data: company };
            if (path.startsWith('/stories')) return { ok: true, status: 200, data: stories };
            if (path.startsWith('/jobs')) return { ok: true, status: 200, data: jobs };
            return { ok: false, status: 404, error: 'Mock missing' };
          }
        },
        storage: {}
      };
      setTimeout(() => document.querySelector('.dme-research-trigger')?.click(), 350);
    </script>
    <script src="../dist/extension/content.js"></script>
  </body>
</html>
