name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_ZIP: MulaLens-${{ github.ref_name }}-chrome-unpacked.zip
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Prepare unpacked Chrome archive
        run: |
          mkdir -p release
          (
            cd dist/extension
            zip -qr "../../release/${RELEASE_ZIP}" .
          )
      - name: Validate unpacked package layout
        run: unzip -Z1 "release/${RELEASE_ZIP}" | grep -Fxq manifest.json
      - name: Create checksums
        run: sha256sum "${RELEASE_ZIP}" > SHA256SUMS.txt
        working-directory: release
      - uses: softprops/action-gh-release@v2
        with:
          name: MulaLens ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/${{ env.RELEASE_ZIP }}
            release/SHA256SUMS.txt
